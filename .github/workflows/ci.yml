# Lint, typecheck, tests and a production build on every push and pull request (BUILD_SPEC 11, phase 6).
# Tests use PGlite (in-process Postgres), so no database or secrets are needed here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Uses the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Proves `next build` works with nothing Vercel-specific (CLAUDE.md rule 8). The build
      # doesn't connect to the database; these placeholders only satisfy start-up checks.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
          AUTH_URL: http://localhost:3100
          APP_ENV: development
          NEXT_TELEMETRY_DISABLED: "1"
